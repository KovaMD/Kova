name: Release

# Triggers on version tags (e.g. v0.1.0-alpha.1) or a manual run from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:

  # Creates the draft release before any platform build starts.  Without this,
  # all three platform jobs race to create the release simultaneously and the
  # losers' assets are silently dropped.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Skip if a release already exists (re-run or workflow_dispatch reuse).
          gh release view "${{ github.ref_name }}" -R "${{ github.repository }}" \
            --json id 2>/dev/null && exit 0

          cat > /tmp/release-notes.md << 'NOTES'
          ## What's new

          ### New features
          - **`kova --export html`** now writes a self-contained interactive HTML deck straight from the command line, alongside the existing `pptx` and `pdf` export formats (requested by @Ayush7614, #220, #242).
          - **Progress bars work inside tables.** A `!progress[label](value)` directive can now sit in a Markdown table cell, including a computed `!sheet` cell driven by a formula such as `!progress[Done](=sum(total))` (contributed by @florian-hubertSE, #240).

          ### Bug fixes
          - **Fixed** Gantt charts still collapsing to an unreadable sliver when every task sits in the past or future. Mermaid draws its "today" marker at the real current date, far off-canvas, and the viewBox auto-fit was pulling it into frame (reported by @a1880, #195).
          - **Fixed** the Nix flake building a broken package that opened to a blank window reading "Could not connect to localhost" (contributed by @vadika, reported by @felix-seifert, #233, #237).
          - **Fixed** `kova --export pdf` on Windows dropping images and diagrams that use a relative path (contributed by @florian-hubertSE, #235).
          - **Fixed** a full-slide `![bg]` background image being painted over, and hidden, on a bare title or section slide (contributed by @florian-hubertSE, #236).
          - **Fixed** dense tables overrunning the bottom of the slide when exported to PPTX; they now scale down to fit their area the way the live preview does (#238).
          - **Fixed** the editor's cursor-to-slide tracking drifting out of alignment when a `---` line appears inside a fenced code block, such as a Mermaid config block (contributed by @florian-hubertSE, #239).

          ### Known issues
          - **Windows Defender may flag Kova as `Trojan:Win32/Wacatac.C!ml`** during install or update — this is a false positive from Microsoft's heuristic/ML detection, not an actual threat (reported in #224). It's tied to Windows builds still being **test-signed** rather than production-signed; we're in the process of moving to full production signing via [SignPath](https://signpath.io). We'll drop this note once production signing is live.

          ---

          ## Installation

          | Platform | Download | Note |
          |---|---|---|
          | **macOS** (Apple Silicon + Intel) | `.dmg` | Signed and notarised — double-click to install |
          | **Windows 10/11** | `.msi` or `_x64-setup.exe` | Test-signed via [SignPath](https://signpath.io) — SmartScreen warning expected, and Defender may flag it (see Known issues above) |
          | **Linux** | `.deb` (Debian/Ubuntu), `.rpm` (Fedora/RHEL/openSUSE), or `.flatpakref` | Install via your package manager |
          | **Linux AppImage** | `.AppImage` | Graphics libs stripped for compatibility with Arch/Fedora/etc. Supports auto-update. |

          > **Beta release** — expect rough edges. Please report bugs via [Issues](../../issues).

          Kova is free and community funded. You can now support development directly through [Open Collective](https://opencollective.com/kovamd).
          NOTES

          gh release create "${{ github.ref_name }}" \
            -R "${{ github.repository }}" \
            --draft \
            --title "Kova ${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md

  release:
    needs: [create-release]
    permissions:
      contents: write   # needed to create the GitHub release and upload assets

    strategy:
      fail-fast: false  # keep building other platforms even if one fails
      matrix:
        include:

          # macOS — universal binary runs on both Intel and Apple Silicon
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin

          # Linux — .deb and .rpm via tauri-action; AppImage is built and
          # signed separately below (see "Build, sign, and upload AppImage"),
          # since it needs post-build stripping/repacking (issue #3) that
          # tauri-action's own build+sign pipeline can't do in between.
          - platform: ubuntu-22.04
            args: '--bundles deb,rpm'
            rust_targets: ''

          # Windows 10/11
          - platform: windows-latest
            args: ''
            rust_targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable as of 2026-05-15
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets }}

      # Rust build cache — dramatically speeds up subsequent runs
      - name: Cache Rust build artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Required system libraries for WebKitGTK on Linux
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      # Write the App Store Connect API key to disk for the post-build notarisation step.
      # The tr -d '\r' strips Windows CRLF endings that corrupt the PEM format.
      - name: Write App Store Connect API key
        if: matrix.platform == 'macos-latest'
        run: printf '%s' "$APPLE_API_KEY_CONTENT" | tr -d '\r' > "$RUNNER_TEMP/AuthKey.p8"
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}

      # Tauri handles signing; notarisation is done in a separate step below to
      # work around a Tauri v2 bug where the notarytool call fails silently.
      - name: Build and publish release (signing only)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS code-signing
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Tauri updater — signs .sig files and generates latest.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Kova ${{ github.ref_name }}'
          releaseDraft: true    # appears as a draft; publish manually after reviewing the assets
          prerelease: false
          args: ${{ matrix.args }}

      # Windows builds from tauri-action above are unsigned (Kova doesn't own an
      # Authenticode certificate) — SignPath's OSS program signs them for us
      # instead. Signing changes the exe/msi bytes, which invalidates the
      # updater .sig tauri-action already computed on the unsigned bytes, so
      # once SignPath returns the signed files we re-sign them with the
      # updater key and patch latest.json — same pattern as the AppImage
      # re-sign below, just for a different reason (external signing vs
      # post-build stripping).
      - name: Stage unsigned Windows binaries for SignPath
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/signpath-unsigned"
          # The Rust build cache persists src-tauri/target/ across releases, so
          # bundle/{msi,nsis} can accumulate old versions' installers alongside
          # the one just built — glob by newest mtime, not just extension, or
          # SignPath's exact-match artifact config chokes on multiple hits.
          cp "$(ls -t src-tauri/target/release/bundle/msi/*.msi | head -1)" "$RUNNER_TEMP/signpath-unsigned/"
          cp "$(ls -t src-tauri/target/release/bundle/nsis/*.exe | head -1)" "$RUNNER_TEMP/signpath-unsigned/"

      # actions/upload-artifact already zips whatever path it's given — that
      # zip is what SignPath's <zip-file> root matches against. Point it at
      # the directory itself rather than a zip we made ourselves, or the two
      # binaries end up nested one level too deep (inside our own zip, inside
      # the zip upload-artifact makes of it) and no configured path matches.
      - name: Upload unsigned Windows binaries as build artifact
        if: matrix.platform == 'windows-latest'
        id: upload-unsigned-windows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signpath-unsigned-windows
          path: ${{ runner.temp }}/signpath-unsigned
          retention-days: 1

      # Debug output for this step (this action's core.debug() calls, which
      # otherwise silently swallow the real rejection reason: the actual
      # HTTP status/statusText on failure, and — more usefully — a `logs`
      # array the SignPath connector sends back that the action relays via
      # redirectConnectorLogsToActionLogs() before surfacing only the
      # generic top-level `error` string) requires the repo-level
      # ACTIONS_STEP_DEBUG secret, not a step env var — core.debug() always
      # *issues* the ::debug:: command, but the runner only persists it to
      # the log when step debug logging is enabled before the job starts.
      - name: Submit Windows binaries to SignPath for signing
        if: matrix.platform == 'windows-latest'
        id: signpath
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 6aea854d-5015-451b-80a3-a1031e70eb9e
          project-slug: kova
          # TEMPORARY: retried release-signing on 2026-08-13 after SignPath
          # support (Phillip) suggested checking the submitter token's access
          # and the signing-policy-slug value — both were confirmed correct
          # (token scoped to a release-signing submitter, slug set to
          # "release-signing") and it still failed with the same opaque
          # "Invalid request to SignPath API." 400. Reported back to SignPath
          # with the run link (github.com/KovaMD/Kova/actions/runs/31739360879,
          # job 94578679760) and failure timestamp (2026-08-13T20:18:38Z) for
          # their server-side logs. Reverted to test-signing so Windows
          # releases aren't blocked while we wait on their reply.
          signing-policy-slug: test-signing
          artifact-configuration-slug: Windows_Executable_Samples
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-signed

      - name: Replace unsigned binaries with SignPath-signed versions and refresh updater signature
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          MSI=$(ls -t src-tauri/target/release/bundle/msi/*.msi | head -1)
          NSIS=$(ls -t src-tauri/target/release/bundle/nsis/*.exe | head -1)

          cp "$RUNNER_TEMP/signpath-signed"/*.msi "$MSI"
          cp "$RUNNER_TEMP/signpath-signed"/*.exe "$NSIS"

          npm install -g @tauri-apps/cli@^2
          tauri signer sign "$MSI"
          tauri signer sign "$NSIS"
          MSI_SIG=$(cat "$MSI.sig")
          NSIS_SIG=$(cat "$NSIS.sig")

          gh release upload "${{ github.ref_name }}" "$MSI" "$NSIS" --clobber

          jq --arg sig "$MSI_SIG" \
             '.platforms["windows-x86_64"].signature = $sig | .platforms["windows-x86_64-msi"].signature = $sig' \
             latest.json > "$RUNNER_TEMP/latest.json.new"
          mv "$RUNNER_TEMP/latest.json.new" latest.json

          jq --arg sig "$NSIS_SIG" \
             '.platforms["windows-x86_64-nsis"].signature = $sig' \
             latest.json > "$RUNNER_TEMP/latest.json.new"
          mv "$RUNNER_TEMP/latest.json.new" latest.json

      # Builds and signs the AppImage, then patches this platform's latest.json
      # (already written to the repo root by the step above) before it gets
      # copied into the cross-platform-merge artifact below — so the fix
      # lands without adding any new race condition.
      #
      # linuxdeploy bundles libwayland-* (built on ubuntu-22.04). The host's
      # Mesa libEGL then loads those stale bundled wayland libs, breaking the
      # Wayland-EGL handshake → "EGL_BAD_PARAMETER. Aborting..." (issue #3,
      # confirmed fixed on Arch by @vadika). Strip them so the AppImage uses
      # host libs, then sign the repacked bytes directly — stripping
      # invalidates whatever signature Tauri would have computed at build
      # time, so createUpdaterArtifacts:false skips generating one to begin
      # with. Proven end-to-end (real self-update, download→verify→install→
      # relaunch) via linux-test-build.yml on 2026-07-03.
      - name: Build, sign, and upload AppImage
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npm run tauri build -- --bundles appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'
          APPIMAGE_DIR="src-tauri/target/release/bundle/appimage"
          APP=$(ls "$APPIMAGE_DIR"/*.AppImage | head -1)
          APP_NAME=$(basename "$APP")

          ( cd "$APPIMAGE_DIR"
            ./"$APP_NAME" --appimage-extract >/dev/null
            cd squashfs-root/usr/lib && rm -f \
              libwayland-client.so* libwayland-cursor.so* libwayland-egl.so* libwayland-server.so* \
              libEGL.so* libGL.so* libGLX.so* libGLdispatch.so* libOpenGL.so* \
              libGLESv2.so* libgbm.so* libdrm.so* libEGL_mesa.so* libgallium*.so* \
              && rm -rf dri/ )

          wget -qO /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          rm -f "$APP"
          ( cd "$APPIMAGE_DIR" && ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 /tmp/appimagetool squashfs-root "$APP_NAME" )
          rm -rf "$APPIMAGE_DIR/squashfs-root"

          # Sign the final (post-strip) bytes directly. tauri-cli's "*.sig"
          # file content is already the final base64 string latest.json
          # expects — re-encoding it (e.g. base64 -w 0 < file.sig) would
          # double-encode and produce a signature that fails verification.
          npm install -g @tauri-apps/cli@^2
          tauri signer sign "$APP"
          SIG=$(cat "$APP.sig")

          gh release upload "${{ github.ref_name }}" "$APP" --clobber

          # tauri-action's deb/rpm build already populated latest.json's
          # linux-x86_64 entry pointing at the .deb — Tauri's updater only
          # supports AppImage on Linux, so that entry was never actually
          # usable. Overwrite it with the signed AppImage instead.
          jq --arg sig "$SIG" \
             --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ github.ref_name }}/$APP_NAME" \
             '.platforms["linux-x86_64"] = {signature: $sig, url: $url}' \
             latest.json > /tmp/latest.json.new
          mv /tmp/latest.json.new latest.json

      # Cached target/ can carry a stale Kova.app.tar.gz.sig from an earlier run
      # into latest.json while the re-bundled tarball that uploads no longer
      # matches it — breaking every macOS self-update. Re-sign the exact bytes
      # we upload, same as the Windows/Linux re-sign steps above.
      - name: Re-sign macOS updater tarball and patch latest.json
        if: matrix.platform == 'macos-latest'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TARBALL=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name '*.app.tar.gz' | head -1)

          npm install -g @tauri-apps/cli@^2
          rm -f "$TARBALL.sig"
          tauri signer sign "$TARBALL"
          SIG=$(cat "$TARBALL.sig")

          gh release upload "${{ github.ref_name }}" \
            "$TARBALL#Kova_universal.app.tar.gz" --clobber

          # All four darwin aliases point at the one universal tarball.
          jq --arg sig "$SIG" '
              .platforms["darwin-aarch64"].signature    = $sig |
              .platforms["darwin-x86_64"].signature     = $sig |
              .platforms["darwin-aarch64-app"].signature = $sig |
              .platforms["darwin-x86_64-app"].signature = $sig
            ' latest.json > /tmp/latest.json.new
          mv /tmp/latest.json.new latest.json

      # Save this platform's latest.json as a workflow artifact so the finalize
      # job can merge all three into one before uploading to the release.
      # Without this, each platform overwrites the shared latest.json in the
      # release, and whichever platform finishes last wins — dropping the others.
      # tauri-action writes latest.json to the project root (process.cwd()),
      # not under src-tauri/target — it's generated in the action's Node
      # process and only ever touches the bundle dir for the .sig files.
      #
      # tauri-action's own updater-json step fetches the release's *current*
      # latest.json and merges it into what it writes locally, so a slower
      # job (macOS, with notarisation) can end up carrying another platform's
      # signature exactly as it stood at that fetch — e.g. Windows's before
      # the SignPath re-sign step overwrote it with the real one. The
      # finalize job's merge is last-write-wins over an unordered `find`, so
      # that stale duplicate can clobber the correct entry depending on
      # enumeration order, shipping a latest.json whose signature doesn't
      # match the hosted binary (issue #166). Strip every key that isn't this
      # job's own platform so there's nothing left to collide on.
      - name: Save platform latest.json artifact
        shell: bash
        run: |
          set -euo pipefail
          LATEST="latest.json"
          if [ ! -f "$LATEST" ]; then
            echo "latest.json not found — skipping artifact upload"
            exit 0
          fi

          case "${{ matrix.platform }}" in
            windows-latest) PREFIX=windows- ;;
            macos-latest)   PREFIX=darwin- ;;
            ubuntu-22.04)   PREFIX=linux- ;;
            *) echo "::error::Unhandled matrix.platform '${{ matrix.platform }}' — add its platforms-key prefix here." >&2; exit 1 ;;
          esac

          mkdir -p "$RUNNER_TEMP/platform-latest"
          jq --arg prefix "$PREFIX" \
             '.platforms |= with_entries(select(.key | startswith($prefix)))' \
             "$LATEST" > "$RUNNER_TEMP/platform-latest/latest.json"
          echo "Found: $LATEST (kept platforms starting with '$PREFIX')"
          jq '.platforms | keys' "$RUNNER_TEMP/platform-latest/latest.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: latest-json-${{ matrix.platform }}
          path: ${{ runner.temp }}/platform-latest/latest.json
          if-no-files-found: warn

      # Submit the signed DMG to Apple, then wait up to 10 minutes for acceptance,
      # and staple the notarisation ticket so Gatekeeper works offline.
      - name: Notarise and staple macOS DMG
        if: matrix.platform == 'macos-latest'
        run: |
          DMG=$(find "$(pwd)/src-tauri/target/universal-apple-darwin/release/bundle/dmg" -name "*.dmg" | head -1)
          echo "Submitting: $DMG"

          # Submit without --wait so we capture the submission ID immediately
          xcrun notarytool submit "$DMG" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json 2>&1 | tee /tmp/submit.json
          SUBMISSION_ID=$(jq -r '.id' /tmp/submit.json)
          echo "Submission ID: $SUBMISSION_ID"

          # No timeout — Apple can take significantly longer on first submission
          # with a new Developer ID cert. Subsequent submissions will be 1-3 min.
          xcrun notarytool wait "$SUBMISSION_ID" \
            --key "$RUNNER_TEMP/AuthKey.p8" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json 2>&1 | tee /tmp/wait.json
          cat /tmp/wait.json

          STATUS=$(jq -r '.status' /tmp/wait.json)
          echo "Notarisation status: $STATUS"
          [ "$STATUS" = "Accepted" ] || { echo "Notarisation rejected"; exit 1; }

          xcrun stapler staple "$DMG"
          echo "Ticket stapled to $DMG"
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      # Replace the unnotarised DMG already uploaded by tauri-action with the
      # stapled copy. Only runs on real tag pushes, not workflow_dispatch tests.
      - name: Replace DMG in release with notarised copy
        if: matrix.platform == 'macos-latest' && github.event_name == 'push'
        run: |
          DMG=$(find "$(pwd)/src-tauri/target/universal-apple-darwin/release/bundle/dmg" -name "*.dmg" | head -1)
          gh release upload "${{ github.ref_name }}" "$DMG" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Create a plain tar.gz with the binary + desktop entry + icons for AUR and
      # direct installs that don't want a package manager bundle.
      - name: Package Linux tar.gz
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          OUTNAME="Kova_${VERSION}_x86_64.tar.gz"
          mkdir -p /tmp/kova/icons
          cp src-tauri/target/release/kova   /tmp/kova/
          cp src-tauri/kova.desktop          /tmp/kova/
          cp src-tauri/icons/32x32.png       /tmp/kova/icons/
          cp src-tauri/icons/64x64.png       /tmp/kova/icons/
          cp src-tauri/icons/128x128.png     /tmp/kova/icons/
          cp src-tauri/icons/128x128@2x.png  /tmp/kova/icons/
          cp LICENSE                         /tmp/kova/
          tar -czf "$OUTNAME" -C /tmp kova
          gh release upload "${{ github.ref_name }}" "$OUTNAME" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Detached PGP signature for the tar.gz, verified by makepkg via the
      # AUR PKGBUILD's validpgpkeys — same signing key as the deb/rpm repos,
      # so AUR installs trust the same identity as the apt/dnf ones.
      - name: Sign Linux tar.gz for AUR
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          OUTNAME="Kova_${VERSION}_x86_64.tar.gz"
          gpg --batch \
            --local-user "$GPG_KEY_ID" \
            --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --pinentry-mode loopback \
            --detach-sign --armor --output "$OUTNAME.sig" "$OUTNAME"
          gh release upload "${{ github.ref_name }}" "$OUTNAME.sig" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs after all platform builds. Adds stable-named (version-free) download
  # aliases so README links never need updating, then removes .sig files to
  # keep the release page clean for non-technical users.
  finalize:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write        # provenance signing (OIDC)
      attestations: write    # write the attestation
    steps:
      - name: Download per-platform latest.json artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: latest-json-*
          path: /tmp/platform-latest-jsons

      - name: Merge latest.json across all platforms
        run: |
          set -euo pipefail
          # Combine the "platforms" objects from all per-platform latest.json files
          # into a single merged latest.json, then upload it to the release.
          mkdir -p /tmp/platform-latest-jsons
          mapfile -t JSON_FILES < <(find /tmp/platform-latest-jsons -name "latest.json")
          if [ "${#JSON_FILES[@]}" -eq 0 ]; then
            echo "::error::No per-platform latest.json artifacts were downloaded — nothing to merge." >&2
            exit 1
          fi
          printf '%s\n' "${JSON_FILES[@]}" | xargs jq -sc '
                .[0] as $base |
                { version: $base.version, notes: $base.notes, pub_date: $base.pub_date,
                  platforms: (reduce .[].platforms as $p ({}; . * $p)) }
              ' > /tmp/latest.json
          echo "Merged platforms:" && jq '.platforms | keys' /tmp/latest.json
          gh release upload "${{ github.ref_name }}" /tmp/latest.json \
            -R KovaMD/Kova --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add stable download aliases and remove .sig files
        id: aliases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          mkdir /tmp/assets

          gh release download "$TAG" -R KovaMD/Kova \
            -p "*.dmg" -p "*_en-US.msi" -p "*-setup.exe" \
            -p "*.deb" -p "*.rpm" -p "*_x86_64.tar.gz" -p "*_amd64.AppImage" \
            -D /tmp/assets --clobber

          # One source of truth (stable alias -> version-named original). cp,
          # upload, and the attest subject-path below all read this map, so a new
          # alias can't ship unattested.
          declare -A ALIAS=(
            [Kova_macOS.dmg]="Kova_${VERSION}_universal.dmg"
            [Kova_Windows.msi]="Kova_${VERSION}_x64_en-US.msi"
            [Kova_Windows_setup.exe]="Kova_${VERSION}_x64-setup.exe"
            [Kova_Linux.deb]="Kova_${VERSION}_amd64.deb"
            [Kova_Linux.rpm]="Kova-${VERSION}-1.x86_64.rpm"
            [Kova_Linux.tar.gz]="Kova_${VERSION}_x86_64.tar.gz"
            [Kova_Linux.AppImage]="Kova_${VERSION}_amd64.AppImage"
          )
          PATHS=()
          for a in "${!ALIAS[@]}"; do
            cp "/tmp/assets/${ALIAS[$a]}" "/tmp/assets/$a"
            PATHS+=("/tmp/assets/$a")
          done

          gh release upload "$TAG" -R KovaMD/Kova "${PATHS[@]}" --clobber
          { echo 'paths<<EOF'; printf '%s\n' "${PATHS[@]}"; echo 'EOF'; } >> "$GITHUB_OUTPUT"

          # Remove Tauri updater .sig files — those signatures are embedded in
          # latest.json. Keep the tar.gz's PGP .sig: that's a detached GPG
          # signature (not a Tauri updater one), and AUR's PKGBUILD downloads
          # it directly for makepkg's validpgpkeys check.
          gh release view "$TAG" -R KovaMD/Kova --json assets \
            --jq '.assets[] | select((.name | endswith(".sig")) and (.name | endswith("_x86_64.tar.gz.sig") | not)) | .name' \
            | xargs -r -I{} gh release delete-asset "$TAG" {} -R KovaMD/Kova --yes

      # Cryptographic provenance tying each release binary to this commit + run.
      # Users verify with: gh attestation verify <file> --repo KovaMD/Kova.
      # !cancelled() so a flaky .sig cleanup above can't skip attestation.
      - name: Attest build provenance for release binaries
        if: ${{ !cancelled() }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.aliases.outputs.paths }}
