name: Frontend Tests

# Runs ESLint, the TypeScript type check (tsc --noEmit) and the Vitest suite
# (engine parser, sheet, layout, PPTX/PDF/HTML export, ...). nix-build only
# compiles the frontend (tsc + vite build), so without this a test-only or
# type-only regression can sit on main unnoticed. Rust tests run inside
# nix-build; this covers the TypeScript side. Tests run with coverage, and the
# thresholds in vitest.config.ts act as a ratchet: the job fails if coverage
# drops below the recorded baseline.
on:
  push:
    branches: [main]
    paths: [src/**, package.json, package-lock.json, tsconfig*.json, vitest.config.ts, eslint.config.js, scripts/**]
  pull_request:
    paths: [src/**, package.json, package-lock.json, tsconfig*.json, vitest.config.ts, eslint.config.js, scripts/**]

jobs:
  vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          check-latest: true
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage
