name: Windows Signing Test Build

# Manually-triggered Windows-only build for testing SignPath signing (in
# particular the production `release-signing` policy, which has been 400ing
# — see release.yml's Windows signing steps) without waiting on a full
# release cycle. Builds unsigned installers, submits them to SignPath, and
# uploads whatever comes back as a private workflow artifact. No GitHub
# release is created and nothing is published publicly.
on:
  workflow_dispatch:
    inputs:
      signing-policy-slug:
        description: 'SignPath signing policy to submit to'
        required: true
        default: 'release-signing'
      artifact-configuration-slug:
        description: 'SignPath artifact-configuration-slug (leave empty to use the project default instead of Windows_Executable_Samples)'
        required: false
        default: ''

jobs:
  windows-test-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # stable as of 2026-05-15
        with:
          toolchain: stable

      - name: Cache Rust build artefacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: windows-latest-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: windows-latest-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # Throwaway build purely to exercise SignPath — skip updater artifacts
      # so no minisign signing key is needed for this test.
      - name: Build Windows bundles
        shell: bash
        run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # Same staging approach as release.yml: glob by newest mtime, not just
      # extension, since the cached target/ dir can carry older installers.
      - name: Stage unsigned Windows binaries for SignPath
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/signpath-unsigned"
          cp "$(ls -t src-tauri/target/release/bundle/msi/*.msi | head -1)" "$RUNNER_TEMP/signpath-unsigned/"
          cp "$(ls -t src-tauri/target/release/bundle/nsis/*.exe | head -1)" "$RUNNER_TEMP/signpath-unsigned/"

      - name: Upload unsigned Windows binaries as build artifact
        id: upload-unsigned-windows
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signpath-unsigned-windows
          path: ${{ runner.temp }}/signpath-unsigned
          retention-days: 1

      # ACTIONS_STEP_DEBUG (repo secret) makes this action's core.debug()
      # calls actually persist to the log, including the `logs` array
      # SignPath's connector sends back on rejection — that's the detail
      # release.yml's equivalent step has never actually captured.
      - name: Submit Windows binaries to SignPath for signing
        id: signpath
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2.2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 6aea854d-5015-451b-80a3-a1031e70eb9e
          project-slug: kova
          signing-policy-slug: ${{ inputs.signing-policy-slug }}
          artifact-configuration-slug: ${{ inputs.artifact-configuration-slug }}
          github-artifact-id: ${{ steps.upload-unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath-signed

      - name: Upload SignPath-signed binaries as artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signpath-signed-windows
          path: ${{ runner.temp }}/signpath-signed
          retention-days: 7
          if-no-files-found: ignore
