# Kova Theme — Example
# ─────────────────────────────────────────────────────────────────────────────
# Copy this file, rename it, and edit the values to create a custom theme.
# Place .yaml files in this folder and restart Kova to load them.
# Only include the properties you want to override — everything else inherits
# from the built-in defaults.
#
# Colour values accept any valid CSS colour: #rrggbb, rgb(), hsl(), etc.

name: My Custom Theme

# By default a custom theme inherits any property you don't set from the
# built-in light theme. Set `extends` to inherit from a different theme
# instead — a built-in id (light, dark, ...) or another installed custom
# theme's filename (without .yaml).
# extends: dark

colors:
  primary:    "#1B3A5C"   # title/section slide background, strong accents
  accent:     "#2563EB"   # links, highlights, progress bars
  background: "#ffffff"   # default slide background
  text:       "#1a1a1a"   # body text
  title_text: "#ffffff"   # text on title and section slides
  # heading and bold are optional — omit either to inherit `text`.
  # heading:  "#1B3A5C"   # content-slide heading colour
  # bold:     "#B91C1C"   # inline **bold**/<strong> colour
  section_bg: "#E8F0FE"   # section divider background
  code_bg:    "#F5F7FA"   # code block background
  # By default, Mermaid flowchart/sequence-diagram colours derive from
  # primary/accent/code_bg/text above. diagram_colors overrides them
  # directly instead — every field is optional; border defaults to
  # diagram_colors.primary (or primary) when left unset.
  # diagram_colors:
  #   primary: "#1B3A5C"   # node/flowchart fill
  #   border:  "#0F2A45"   # node/flowchart border
  #   line:    "#2563EB"   # connecting lines/edges
  #   cluster: "#F5F7FA"   # subgraph/cluster background
  #   text:    "#1a1a1a"   # node/edge/sequence label text

fonts:
  title: "Inter, 'Helvetica Neue', Arial, sans-serif"
  body:  "Inter, 'Helvetica Neue', Arial, sans-serif"
  code:  "'JetBrains Mono', 'Fira Code', monospace"

layout:
  title_align:   center      # center | left | bottom-left
  heading_align: left        # left | center
  decoration:    none        # none | dots | grid | diagonal | bar-left

footer:
  show:              false
  text:              "{title} — {slide_number} / {total}"
  show_slide_number: true
  # hide_on_title:   true   # suppress just on the title slide

header:
  show: false
  text: ""
  # hide_on_title: true   # suppress just on the title slide
